site_name: Impact Assessment Engine
site_description: Baltic RCC impact assessment engine
repo_url: https://github.com/Baltic-RCC/impact-assessment-engine
repo_name: Baltic-RCC/impact-assessment-engine

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            docstring_section_style: table
            show_source: true
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Guides:
      - Remedial action lookup jobs: guides/remedial_action_lookup.md
  - API Reference:
      - brcc_pypowsybl_helpers:
          - converters: api/brcc_pypowsybl_helpers/converters.md
          - helper: api/brcc_pypowsybl_helpers/helper.md
          - lf_parameters: api/brcc_pypowsybl_helpers/lf_parameters.md
          - models: api/brcc_pypowsybl_helpers/models.md
      - impact_assessment_engine:
          - impact_assessment: api/impact_assessment_engine/impact_assessment.md
      - impact_assessment_reporting:
          - iam_builder: api/impact_assessment_reporting/iam_builder.md
      - remedial_action_lookup:
          - job_config: api/remedial_action_lookup/job_config.md
          - ra_lookup: api/remedial_action_lookup/ra_lookup.md
