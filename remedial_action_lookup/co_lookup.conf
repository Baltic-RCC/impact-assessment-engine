# Contingency lookup job configuration, used by run_co_lookup.py
# Environment variable with the same name overrides value defined here, empty value means default

# CGMES model zip to look up contingencies from
MODEL_PATH=path_to_model
# Output xlsx in common contingency list columns, to be set as CONTINGENCY_LIST_PATH in ra_lookup.conf or ra_assessment.conf
OUTPUT_PATH=contingencies.xlsx

# Ordinary contingency of each element in service, as of initial load flow currents:
# lines, transformers and tie line sides at this voltage level in kV and above
MIN_NOMINAL_VOLTAGE_KV=330
# and generators of these comma separated energy sources: THERMAL, NUCLEAR, HYDRO, WIND, SOLAR, OTHER
GENERATOR_ENERGY_SOURCES=THERMAL,NUCLEAR,HYDRO
# with maximum active power in MW and above, at any voltage level
MIN_GENERATOR_P_MW=100
# Comma separated countries of contingency elements, e.g. PL,LT, empty for all
CONTINGENCY_REGIONS='LT'

# pypowsybl CGMES import parameters as JSON, keep same as in RA lookup and assessment so element ids match
CGMES_IMPORT_PARAMETERS={"iidm.import.cgmes.source-for-iidm-id": "rdfID", "iidm.import.cgmes.import-node-breaker-as-bus-breaker": "False"} #import parameters for BA CGM
# CGMES_IMPORT_PARAMETERS={"iidm.import.cgmes.source-for-iidm-id": "rdfID", #Import parameters for pan-eu CGM
#                         "iidm.import.cgmes.store-cgmes-model-as-network-extension": "true",
#                         "iidm.import.cgmes.create-active-power-control-extension": "true",
#                         "iidm.import.cgmes.post-processors": "EntsoeCategory"}
#}
# DEBUG, INFO, WARNING or ERROR
LOG_LEVEL=INFO
