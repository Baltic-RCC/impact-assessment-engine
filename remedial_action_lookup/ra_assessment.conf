# Remedial action flow influence assessment job configuration, used by run_ra_assessment.py
# Environment variable with the same name overrides value defined here, empty value means default

# CGMES model zip to assess
MODEL_PATH=
# Common remedial action list xlsx, power remedial actions (countertrade, redispatch) are skipped
REMEDIAL_ACTION_LIST_PATH=
# Comma separated ra_name values to assess, empty for all
REMEDIAL_ACTION_NAMES=
# Common contingency list xlsx, empty for base case only
CONTINGENCY_LIST_PATH=
# Comma separated co_name values to assess, empty for all
CONTINGENCY_NAMES=
# Assessed element list xlsx from run_ae_lookup.py (or common assessed element list), empty to look up from model
ASSESSED_ELEMENT_LIST_PATH=
# Output xlsx with sheets: flow_influence - flow influence results, assessed_elements - assessed elements used
OUTPUT_PATH=remedial_action_flow_influence.xlsx

# Assessed elements looked up from model: lines, transformers and tie line sides at this voltage level in kV and above
MIN_NOMINAL_VOLTAGE_KV=330
# Comma separated countries (secured_for_region) of assessed elements, e.g. PL,LT, empty for all, applies to list too
ASSESSED_REGIONS=
# Influence factor threshold in percent for if_above_threshold result column
THRESHOLD_PERCENT=5
# Keep influence factors of remedial actions and contingencies which split off an island from the network
IGNORE_EMERGED_ISLANDS=True

# pypowsybl CGMES import parameters as JSON
CGMES_IMPORT_PARAMETERS={"iidm.import.cgmes.source-for-iidm-id": "rdfID", "iidm.import.cgmes.import-node-breaker-as-bus-breaker": "False"} #import parameters for BA CGM
# CGMES_IMPORT_PARAMETERS={"iidm.import.cgmes.source-for-iidm-id": "rdfID", #Import parameters for pan-eu CGM
#                         "iidm.import.cgmes.store-cgmes-model-as-network-extension": "true",
#                         "iidm.import.cgmes.create-active-power-control-extension": "true",
#                         "iidm.import.cgmes.post-processors": "EntsoeCategory"}
#}
# DEBUG, INFO, WARNING or ERROR
LOG_LEVEL=INFO
