# Remedial action lookup job configuration, used by run_ra_lookup.py
# Environment variable with the same name overrides value defined here, empty value means default

# CGMES model zip to assess
MODEL_PATH=path_to_model
# Assessed element list xlsx from run_ae_lookup.py (or common assessed element list), empty to look up from model
ASSESSED_ELEMENT_LIST_PATH=path_to_ae_list
# Contingency list xlsx from run_co_lookup.py (or common contingency list), empty to look up from model
CONTINGENCY_LIST_PATH=path_to_co_list
# Output xlsx with sheets: xra - cross border relevant remedial actions, all - every candidate, contingencies - contingencies used
OUTPUT_PATH=cross_border_relevant_remedial_actions.xlsx

# False skips influence factor assessment: output is only sheet all with every remedial action at relevant voltage level
RUN_IF_ASSESSMENT_FOR_RAS=True
# True assesses remedial actions at base case and each N-1 contingency, False at base case only
# N-1 runs a load flow per remedial action and contingency, narrow CONTINGENCY_REGIONS or the list to shorten it
RUN_N1_FOR_RAS=True
# Relevant voltage level in kV: 330 for Baltic CCR, 400 for pan-EU
MIN_NOMINAL_VOLTAGE_KV=330
# Influence factor threshold on neighbouring TSO elements in percent, at base case or any contingency
THRESHOLD_PERCENT=5
# Keep influence factors of remedial actions and contingencies which split off an island from the network
IGNORE_EMERGED_ISLANDS=True

# Contingencies looked up from model, as in co_lookup.conf: elements in service at MIN_NOMINAL_VOLTAGE_KV and above
# and generators of these comma separated energy sources: THERMAL, NUCLEAR, HYDRO, WIND, SOLAR, OTHER
GENERATOR_ENERGY_SOURCES=THERMAL,NUCLEAR,HYDRO
# with maximum active power in MW and above, at any voltage level
MIN_GENERATOR_P_MW=100
# Comma separated countries of contingency elements, e.g. PL,LT, empty for all
CONTINGENCY_REGIONS='LT'

# pypowsybl CGMES import parameters as JSON
CGMES_IMPORT_PARAMETERS={"iidm.import.cgmes.source-for-iidm-id": "rdfID", "iidm.import.cgmes.import-node-breaker-as-bus-breaker": "False"} #import parameters for BA CGM
# CGMES_IMPORT_PARAMETERS={"iidm.import.cgmes.source-for-iidm-id": "rdfID", #Import parameters for pan-eu CGM
#                         "iidm.import.cgmes.store-cgmes-model-as-network-extension": "true",
#                         "iidm.import.cgmes.create-active-power-control-extension": "true",
#                         "iidm.import.cgmes.post-processors": "EntsoeCategory"}
#}
# DEBUG, INFO, WARNING or ERROR
LOG_LEVEL=INFO
